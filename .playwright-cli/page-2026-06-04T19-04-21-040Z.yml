              - paragraph [ref=e286]: 我希望这里不只是一个“搭好后放着”的网站，而是一个能够长期积累的地方。以后遇到值得记录的问题、学到的新知识、做过的小项目，都可以整理成文章放在这里。
              - generic [ref=e287]:
                - heading "为什么要写博客#" [level=2] [ref=e288]:
                  - text: 为什么要写博客
                  - link "#" [ref=e289] [cursor=pointer]:
                    - /url: "#为什么要写博客"
                - paragraph [ref=e290]: 很多问题在解决的时候看起来很清楚，过一段时间再回头就只剩下零散印象。写博客的价值，是把当时的判断、尝试、错误和结果保存下来。
                - paragraph [ref=e291]: 对我来说，它至少有三个作用：
                - list [ref=e292]:
                  - listitem [ref=e293]: 把学习过程写清楚，避免重复踩坑
                  - listitem [ref=e294]: 把项目经验沉淀下来，方便以后复盘
                  - listitem [ref=e295]: 训练表达能力，让想法变得更准确
