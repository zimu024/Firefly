                - paragraph [ref=e299]: 博客初期会先围绕几个方向更新：
                - list [ref=e300]:
                  - listitem [ref=e301]: 技术笔记：开发环境、框架使用、部署流程、常见问题
                  - listitem [ref=e302]: 项目记录：需求拆解、实现方案、问题修复、上线总结
                  - listitem [ref=e303]: 阅读整理：书籍、课程和文章里的重要观点
