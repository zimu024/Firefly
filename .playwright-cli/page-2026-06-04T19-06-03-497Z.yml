                  - link "#" [ref=e109] [cursor=pointer]:
                    - /url: "#为什么要写博客"
                - paragraph [ref=e110]: 很多问题在解决的时候看起来很清楚，过一段时间再回头就只剩下零散印象。写博客的价值，是把当时的判断、尝试、错误和结果保存下来。
                - paragraph [ref=e111]: 对我来说，它至少有三个作用：
                - list [ref=e112]:
                  - listitem [ref=e113]: 把学习过程写清楚，避免重复踩坑
                  - listitem [ref=e114]: 把项目经验沉淀下来，方便以后复盘
                  - listitem [ref=e115]: 训练表达能力，让想法变得更准确
